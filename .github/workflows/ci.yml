name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + test come from the shared reusable workflow (forge dogfoods its own).
  ci:
    uses: ./.github/workflows/go-ci.yml
    with:
      coverage-threshold: 85

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - name: Build
        run: go build ./...
