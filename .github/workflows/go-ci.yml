# Reusable lint + test CI for the adaouat CLI family (forge, bifrost, heraut).
# Callers add one job: `uses: adaouat/forge/.github/workflows/go-ci.yml@<sha>`.
# Build and release stay per-app. See docs/adr/0006-shared-ci-reusable-workflow.md.
name: Go CI

on:
  workflow_call:
    inputs:
      coverage-threshold:
        # Required, no default: the threshold is per-project policy (bifrost 20,
        # heraut/forge 85 — not a shared convention), so forge holds no default that
        # could silently govern a caller. Every caller declares its own.
        description: Minimum total test coverage percentage (fail below).
        type: number
        required: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - name: Lint
        run: golangci-lint run ./...
      - name: Vulnerability scan
        run: govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - name: Test
        run: go test ./... -coverprofile=coverage.out
      - name: Check coverage threshold
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |-
          go tool cover -func=coverage.out | awk -v threshold="$THRESHOLD" '
            /^total:/ {
              pct = substr($3, 1, length($3)-1)
              printf "Total coverage: %s%%\n", pct
              if (pct+0 < threshold+0) {
                printf "Error: coverage %s%% is below the %s%% threshold\n", pct, threshold
                exit 1
              }
            }'

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect GoReleaser config
        id: detect
        run: |-
          if [ -f .goreleaser.yml ] || [ -f .goreleaser.yaml ]; then
            echo "found=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::no .goreleaser.yml, skipping the GoReleaser check"
          fi
      - name: Check GoReleaser config
        if: steps.detect.outputs.found == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Keep in step with release-build's goreleaser version.
          version: "2.19.0"
          args: check
