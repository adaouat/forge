# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/v0.80.0/schema.json

version: "1"

versioning:
  strategy: semver
  tag_prefix: v

changelog: {}

release: {}

forges:
  - name: GitHub
    platform: github

commits:
  rules:
    - name: no-claude-session
      deny: '(?i)\bClaude-Session\b'
      target: footer
      message: "Claude-Session is not allowed in commit messages"
    - name: subject-max-72
      deny: '^.{73,}'
      target: header
      message: "commit subject must be at most 72 characters"
